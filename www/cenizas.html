<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>CENIZAS</title>
<style>
@font-face{font-family:"Bebas";src:url(/a/bebas.woff2) format("woff2");font-display:block}
@font-face{font-family:"Elite";src:url(/a/elite.woff2) format("woff2");font-display:swap}
@font-face{font-family:"TechMono";src:url(/a/mono.woff2) format("woff2");font-display:swap}
:root{--hi:#f1efe9;--ink:#d8d6d0;--dim:#8e8b84;--ash:#bdb8ae;--alert:#d23a2c;--acc:#bdb8ae;color-scheme:dark}
:root[data-fac="ork"]{--acc:#e2433a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#000;color:var(--ink);font-family:"TechMono",ui-monospace,monospace;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.btn{font-family:"Bebas",sans-serif;font-size:20px;letter-spacing:.16em;padding:10px 18px 8px;border:1px solid var(--ash);color:var(--hi);background:rgba(0,0,0,.4)}
.btn.solid{background:var(--hi);color:#000;border-color:var(--hi)}
:root[data-fac="ork"] .btn.solid{background:#c9302a;color:#fff;border-color:#c9302a}
/* HUD */
.hud{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:max(10px,env(safe-area-inset-top,0px));display:flex;gap:12px;align-items:center;pointer-events:none}
.hud .nk{font-family:"Bebas",sans-serif;font-size:22px;letter-spacing:.12em;color:var(--hi);text-shadow:0 1px 2px #000}
.bar{width:150px;height:10px;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.5)}
.bar i{display:block;height:100%;background:#d8d6d0;transition:width .2s}
.bar.xp{height:5px;margin-top:3px}
.bar.xp i{background:var(--acc)}
.hud small{display:block;font-size:11px;color:var(--ash);text-shadow:0 1px 2px #000;margin-top:3px;letter-spacing:.06em}
.topr{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:max(10px,env(safe-area-inset-top,0px));display:flex;gap:10px;align-items:center}
.topr .sala{font-size:11.5px;color:var(--ash);text-shadow:0 1px 2px #000;text-align:right;letter-spacing:.06em}
.menub{font-family:"Bebas",sans-serif;font-size:18px;letter-spacing:.14em;padding:6px 12px 4px;border:1px solid rgba(255,255,255,.6);background:rgba(0,0,0,.45);color:var(--hi)}
/* controles */
.pads{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:10px;align-items:end}
.pb{width:74px;height:74px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(0,0,0,.35);font-family:"Bebas",sans-serif;font-size:30px;color:var(--hi);display:grid;place-items:center;line-height:1}
.pb small{display:block;font-family:"TechMono",monospace;font-size:9px;letter-spacing:.06em;color:var(--ash)}
.pb.b{width:88px;height:88px;border-color:var(--acc)}
.pb.a{grid-column:1;grid-row:2;margin-bottom:-6px}
.pb.b{grid-column:2;grid-row:1/3}
.pb:active,.pb.on{background:rgba(255,255,255,.18)}
.stick{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.25);pointer-events:none;transform:translate(-50%,-50%)}
.stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.35)}
.hintL{position:fixed;left:max(20px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));font-size:11px;color:rgba(255,255,255,.45);pointer-events:none}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.box{width:min(100%,420px);border:1px solid #444;background:#0b0b0b;padding:18px;text-align:center}
.box h2{font-family:"Bebas",sans-serif;font-weight:400;font-size:30px;letter-spacing:.16em;margin:0 0 6px;color:var(--hi)}
.box p{font-family:"Elite",monospace;line-height:1.5;margin:0 0 14px;font-size:14px}
.box .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.say{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;width:min(92vw,520px);z-index:21}
.say input{flex:1;min-width:0;background:rgba(0,0,0,.8);border:1px solid var(--ash);color:var(--hi);font:inherit;font-size:16px;padding:10px 12px}
/* creador */
.cre{position:fixed;inset:0;z-index:22;background:#050505;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cre .pv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0}
.cre .pv canvas{width:min(100%,240px);height:auto;aspect-ratio:3/4;image-rendering:pixelated;border:1px solid #333;background:radial-gradient(circle at 50% 70%,#2a2a2a,#0a0a0a)}
.cre h1{font-family:"Bebas",sans-serif;font-weight:400;font-size:30px;letter-spacing:.18em;margin:0;color:var(--hi)}
.cre .opts{display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0;justify-content:center}
.opt{display:grid;grid-template-columns:96px 40px minmax(0,1fr) 40px;gap:6px;align-items:center}
.opt span{font-size:11.5px;letter-spacing:.14em;color:var(--dim)}
.opt b{font-weight:400;text-align:center;color:var(--hi);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt button{height:36px;border:1px solid #444;font-size:18px;color:var(--hi)}
.cre .go{margin-top:8px}
@media (orientation:portrait){.cre{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}.cre .pv canvas{width:150px}}
.rot{position:fixed;inset:0;z-index:30;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;font-family:"Elite",monospace}
.rot .ph{width:46px;height:78px;border:3px solid var(--ash);border-radius:8px;animation:rt 2s ease-in-out infinite}
@keyframes rt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){body.playing .rot{display:flex}}
.fade{position:fixed;inset:0;background:#000;pointer-events:none;opacity:0;transition:opacity .6s;z-index:15}
.fade.on{opacity:1}
.toast{position:fixed;z-index:25;left:50%;top:max(54px,env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(0,0,0,.8);border:1px solid var(--ash);padding:8px 14px;font-size:13px;max-width:80vw;text-align:center}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud" id="hud" hidden>
  <div><div class="nk" id="h-nick">—</div></div>
  <div><div class="bar"><i id="h-hp" style="width:100%"></i></div><div class="bar xp"><i id="h-xp" style="width:0"></i></div><small id="h-lv">NV 1 · PALO</small></div>
</div>
<div class="topr" id="topr" hidden><div class="sala" id="h-sala">conectando…</div><button class="menub" id="menu-b">MENÚ</button></div>
<div class="pads" id="pads" hidden>
  <button class="pb a" id="btn-a" aria-label="Hablar o usar">A<small id="a-lab">HABLAR</small></button>
  <button class="pb b" id="btn-b" aria-label="Golpear">B<small>GOLPEAR</small></button>
</div>
<div class="stick" id="stick" hidden><i id="knob"></i></div>
<div class="hintL" id="hintL" hidden>arrastrá acá para caminar</div>
<div class="fade" id="fade"></div>
<div class="toast" id="toast" hidden></div>

<div class="say" id="say" hidden><input id="say-in" maxlength="80" placeholder="Decí algo…" autocomplete="off"><button class="btn solid" id="say-go">DECIR</button></div>

<div class="ov" id="ov-load"><div class="box"><h2>CENIZAS</h2><p id="load-t">conectando con el Parque del Nogal…</p></div></div>

<div class="ov" id="ov-menu" hidden><div class="box"><h2>PAUSA</h2><p>Tu personaje queda donde está. La próxima vez arrancás acá mismo.</p>
  <div class="row"><button class="btn" id="m-back">SEGUIR</button><button class="btn solid" id="m-exit">GUARDAR Y VOLVER</button></div></div></div>

<div class="ov" id="ov-dead" hidden><div class="box"><h2>CAÍSTE</h2><p>La ceniza te cubrió. Despertás junto al fogón del nogal.</p><div class="row"><button class="btn solid" id="d-ok">LEVANTARSE</button></div></div></div>

<section class="cre" id="cre" hidden>
  <div class="pv"><h1>TU SOBREVIVIENTE</h1><canvas id="pv" width="48" height="64"></canvas><button class="btn" id="pv-rot" style="font-size:15px;padding:6px 12px 4px">GIRAR</button></div>
  <div class="opts" id="opts"></div>
</section>

<div class="rot"><div class="ph"></div><p>Girá el celu para jugar</p></div>

<script src="/a/supabase.js"></script>
<script src="/config.js"></script>
<script src="/cenizas.js"></script>
</body>
</html>
