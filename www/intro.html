<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>THE O|F · Intro</title>
<style>
@font-face{font-family:"TechMono";src:url(/a/mono.woff2) format("woff2");font-display:swap}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;background:#000}
.f{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1.1s ease}
.f.on{opacity:1}
.f img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;transform-origin:var(--ox,50%) var(--oy,50%);will-change:transform}
.f.on img{animation:kb var(--d,6s) linear forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(var(--z,1.08)) translate(var(--px,0),var(--py,0))}}
#skip{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);z-index:5;
  font:13px TechMono,monospace;letter-spacing:.14em;color:#ece8de;background:rgba(0,0,0,.55);border:1px solid rgba(236,232,222,.35);border-radius:8px;padding:9px 14px;cursor:pointer}
#bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;justify-content:center;gap:5px;z-index:5;pointer-events:none}
#bar i{width:14px;height:3px;background:rgba(236,232,222,.25);border-radius:2px}
#bar i.on{background:#ece8de}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;font:11px TechMono,monospace;letter-spacing:.2em;color:rgba(236,232,222,.45);z-index:5;pointer-events:none;transition:opacity 1s}
#black{position:fixed;inset:0;background:#000;opacity:0;transition:opacity 1.2s;pointer-events:none;z-index:9}
</style>
</head>
<body>
<div id="stage"></div>
<button id="skip">SALTAR ▸▸</button>
<div id="hint">TOCÁ PARA SEGUIR</div>
<div id="bar"></div>
<div id="black"></div>
<script>
(function(){
  const NEXT = '/cenizas.html?modo=historia';
  /* 1-9: Pablo · 10-18: termina en THE O|F. d = segundos en pantalla; z/px/py/ox/oy = movimiento de cámara */
  const F = [
    {d:6.5, z:1.10, ox:'30%', oy:'40%'},
    {d:6,   z:1.12, ox:'60%', oy:'50%'},
    {d:6.5, z:1.10, ox:'70%', oy:'45%'},
    {d:7,   z:1.12, ox:'65%', oy:'35%'},
    {d:7,   z:1.08, ox:'60%', oy:'40%'},
    {d:6.5, z:1.10, ox:'70%', oy:'40%'},
    {d:7.5, z:1.06, ox:'40%', oy:'45%'},
    {d:8,   z:1.05, ox:'35%', oy:'55%'},
    {d:7,   z:1.08, ox:'50%', oy:'50%'},
    {d:6,   z:1.10, ox:'55%', oy:'45%'},
    {d:6,   z:1.10, ox:'65%', oy:'40%'},
    {d:6,   z:1.10, ox:'65%', oy:'40%'},
    {d:6,   z:1.10, ox:'55%', oy:'40%'},
    {d:6.5, z:1.08, ox:'65%', oy:'50%'},
    {d:6.5, z:1.10, ox:'70%', oy:'60%'},
    {d:7,   z:1.08, ox:'65%', oy:'60%'},
    {d:7,   z:1.08, ox:'55%', oy:'55%'},
    {d:8,   z:1.05, ox:'75%', oy:'80%'}
  ];
  const stage = document.getElementById('stage'), bar = document.getElementById('bar');
  const els = F.map((f, i) => {
    const d = document.createElement('div'); d.className = 'f';
    const im = new Image(); im.src = '/a/intro/' + String(i + 1).padStart(2, '0') + '.jpg'; im.alt = '';
    d.style.setProperty('--d', (f.d + 1.2) + 's'); d.style.setProperty('--z', f.z); d.style.setProperty('--ox', f.ox); d.style.setProperty('--oy', f.oy);
    d.appendChild(im); stage.appendChild(d);
    const dot = document.createElement('i'); bar.appendChild(dot);
    return d;
  });
  /* música de misterio: arranca sola si el teléfono la deja; si no, con el primer toque */
  const mus = new Audio('/a/intro/musica.mp3'); mus.preload = 'auto'; mus.loop = true; mus.volume = .85;
  let musOn = false; const playMus = () => { if (musOn || done) return; mus.play().then(() => { musOn = true; }).catch(() => {}); };
  ['pointerdown', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, playMus, { once: false, passive: true }));
  let cur = -1, timer = null, done = false;
  function show(i) {
    if (done) return;
    if (i >= els.length) return finish();
    if (cur >= 0) { els[cur].classList.remove('on'); }
    cur = i;
    const el = els[i]; const im = el.firstChild; im.style.animation = 'none'; void im.offsetWidth; im.style.animation = '';
    el.classList.add('on');
    [...bar.children].forEach((b, k) => b.classList.toggle('on', k <= i));
    clearTimeout(timer); timer = setTimeout(() => show(i + 1), F[i].d * 1000);
    if (i === 2) document.getElementById('hint').style.opacity = 0;
  }
  function finish() {
    if (done) return; done = true; clearTimeout(timer);
    try { localStorage.setItem('theof_intro_vista', '1'); } catch (_) {}
    document.getElementById('black').style.opacity = 1;
    { const v0 = mus.volume; let k = 0; const fi = setInterval(() => { k++; mus.volume = Math.max(0, v0 * (1 - k / 12)); if (k >= 12) { clearInterval(fi); mus.pause(); } }, 100); }
    setTimeout(() => { location.replace(NEXT); }, 1200);
  }
  document.getElementById('skip').addEventListener('click', e => { e.stopPropagation(); finish(); });
  stage.addEventListener('click', () => show(cur + 1));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') finish(); else if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter') show(cur + 1); });
  /* arranca cuando cargó la primera viñeta (o a los 2 s igual) */
  const first = els[0].firstChild; let started = false; const go = () => { if (!started) { started = true; playMus(); show(0); } };
  if (first.complete) go(); else { first.onload = go; first.onerror = go; setTimeout(go, 2000); }
})();
</script>
</body>
</html>
